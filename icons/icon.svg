<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12"/>
      <stop offset="50%" stop-color="#0f2b1d"/>
      <stop offset="100%" stop-color="#05120b"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Sun / Solar Energy Core -->
  <circle cx="360" cy="140" r="48" fill="url(#sunGrad)" filter="url(#glow)"/>
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="360" y1="70" x2="360" y2="85" />
    <line x1="360" y1="195" x2="360" y2="210" />
    <line x1="290" y1="140" x2="305" y2="140" />
    <line x1="415" y1="140" x2="430" y2="140" />
    <line x1="310" y1="90" x2="322" y2="102" />
    <line x1="398" y1="178" x2="410" y2="190" />
    <line x1="310" y1="190" x2="322" y2="178" />
    <line x1="398" y1="102" x2="410" y2="90" />
  </g>

  <!-- Plant Stem & Leaves -->
  <path d="M 256 420 Q 256 300 230 220 Q 210 150 256 120 Q 290 180 270 260 Q 256 330 256 420 Z" fill="url(#leafGrad)" />
  
  <!-- Left Leaf -->
  <path d="M 240 290 C 140 280 120 180 170 140 C 230 180 235 240 240 290 Z" fill="url(#leafGrad)" filter="url(#glow)"/>
  
  <!-- Right Leaf -->
  <path d="M 265 240 C 350 220 380 140 330 110 C 280 140 270 190 265 240 Z" fill="url(#leafGrad)" filter="url(#glow)"/>

  <!-- Water Drop (TETES) in Center -->
  <path d="M 256 260 C 256 260 210 320 210 355 C 210 385 230 410 256 410 C 282 410 302 385 302 355 C 302 320 256 260 256 260 Z" fill="url(#dropGrad)" filter="url(#glow)"/>
  <ellipse cx="244" cy="350" rx="8" ry="14" fill="#ffffff" opacity="0.6" transform="rotate(-20 244 350)" />

  <!-- AI Circuit Nodes -->
  <g stroke="#34d399" stroke-width="3" opacity="0.7">
    <line x1="100" y1="380" x2="160" y2="380" />
    <circle cx="100" cy="380" r="6" fill="#10b981" />
    <circle cx="160" cy="380" r="4" fill="#34d399" />
    
    <line x1="160" y1="380" x2="200" y2="420" />
    <circle cx="200" cy="420" r="5" fill="#10b981" />

    <line x1="412" y1="380" x2="352" y2="380" />
    <circle cx="412" cy="380" r="6" fill="#10b981" />
    <circle cx="352" cy="380" r="4" fill="#34d399" />
    
    <line x1="352" y1="380" x2="312" y2="420" />
    <circle cx="312" cy="420" r="5" fill="#10b981" />
  </g>

  <!-- Technology / AI Pulse rings -->
  <circle cx="256" cy="355" r="75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
</svg>